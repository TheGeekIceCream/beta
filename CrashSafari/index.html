<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Essential tag to adapt properly to mobile screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrashSafari - Safe Version</title>
    <link rel="icon" href="zfavicon.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Times New Roman", Times, serif;
        }
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px; /* Maximum width on desktops and laptops */
            width: 100%;      /* Takes up full available width on mobile devices */
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #d9534f;
        }
        img {
            width: 100%;
            max-width: 320px; /* Prevents the image from being too large on big screens */
            height: auto;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
            transition: transform 0.3s ease;
        }
        /* Smooth effect on mouse hover on desktop or tap on mobile */
        img:hover {
            transform: scale(1.05);
        }
        .original-quote {
            display: none; /* Hidden until the 93 steps finish */
            font-size: 1.3rem;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 12px;
        }
        p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        #status {
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            background-color: #eef2f7;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CrashSafari - Safe Version</h1>
        
        <img src="cat-hover.jpg" alt="CrashSafari Cat">
        
        <p id="final-quote" class="original-quote">What were you expecting?</p>
        <p>Watch how the address bar above changes safely.</p>
        <p id="status">Starting simulation...</p>
    </div>

    <script>
        let counter = 0;
        let urlText = "";
        const maxRepetitions = 93;

        const interval = setInterval(() => {
            counter++;
            urlText += counter;
            
            try {
                window.history.pushState(null, "", "#" + urlText);
                document.getElementById("status").innerText = "Running... step " + counter + " of " + maxRepetitions;
            } catch (error) {
                document.getElementById("status").innerText = "The browser stopped the excessive calls.";
                clearInterval(interval);
            }

            if (counter >= maxRepetitions) {
                clearInterval(interval);
                document.getElementById("status").innerText = "CrashSafari finished safely.";
                document.getElementById("final-quote").style.display = "block";
            }
        }, 150);
    </script>
</body>
</html>
