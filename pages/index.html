<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Redirección automática: 1 segundo de espera hacia Wikipedia -->
    <meta http-equiv="refresh" content="1; url=https://youareanidiot.cc/lol.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        #loading { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            /* Se cambió la tipografía a Times New Roman */
            font-family: "Times New Roman", Times, serif; 
            font-size: 48px; 
            font-weight: 600; 
            color: rgb(0, 0, 0); 
        }
        #loading .dot { animation: 1.4s ease 0s infinite normal both running loading-blink; }
        #loading .dot:first-child { animation-delay: 0.2s; }
        #loading .dot:nth-child(2) { animation-delay: 0.4s; }
        #loading .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes loading-blink { 
            0%, 100%, 80% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="loading" role="status" aria-label="Loading">
        Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
</body>
</html>
